name: Build Signed Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/selection@v3
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Run Python Script
        run: python3 create_project.py

      - name: Extract Project
        run: unzip my-admob-app.zip -d .

      - name: Install Dependencies & Build Web Assets
        run: |
          cd my-admob-app
          npm install
          npx cap add android
          npx cap sync android

      - name: Generate Keystore & Build Signed APK
        run: |
          cd my-admob-app/android
          keytool -genkey -v -keystore release.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Developer, OU=App, O=Studio, L=City, S=State, C=US" -storepass mypassword123 -keypass mypassword123
          ./gradlew assembleRelease
          cd app/build/outputs/apk/release/
          $ANDROID_HOME/build-tools/33.0.0/apksigner sign --ks ../../../../release.keystore --ks-pass pass:mypassword123 --out app-release-signed.apk app-release-unsigned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v3
        with:
          name: signed-apk
          path: my-admob-app/android/app/build/outputs/apk/release/app-release-signed.apk
