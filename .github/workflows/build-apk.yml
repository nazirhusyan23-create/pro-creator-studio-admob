name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install project dependencies
        run: npm install

      - name: Install Capacitor CLI locally (fallback if not in package.json)
        run: npm install @capacitor/cli@^5.0.0 --no-save

      - name: Add Android platform (only if missing)
        run: |
          if [ ! -f "android/build.gradle" ]; then
            echo "Android gradle project not found, generating it with Capacitor..."
            npx cap add android
          else
            echo "Android gradle project already present, skipping cap add."
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
